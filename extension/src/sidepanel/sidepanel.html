<!doctype html>
<html lang="zh" data-i18n-pending>
<head>
  <meta charset="utf-8">
  <title data-i18n="sp.docTitle">MeetScribe 字幕</title>
  <link rel="stylesheet" href="../ui/base.css">
  <style>
    body { height: 100vh; display: flex; flex-direction: column; }
    header { padding: 10px 12px; border-bottom: 1px solid var(--border); }
    header .top { display: flex; align-items: center; gap: 8px; }
    header .title { font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .timer { font-variant-numeric: tabular-nums; color: var(--text-soft); }
    .sources { display: flex; gap: 12px; margin-top: 6px; flex-wrap: wrap; font-size: 12px; }
    .src { display: flex; align-items: center; gap: 6px; }
    .src .name { font-weight: 600; }
    .src.me .name { color: var(--me); }
    .src.them .name { color: var(--them); }
    .langs { display: flex; align-items: center; gap: 8px; margin-top: 6px; flex-wrap: wrap; }
    #notices:not(:empty) { padding: 8px 12px 0; display: grid; gap: 6px; }
    main { flex: 1; overflow-y: auto; padding: 8px 4px 8px 8px; }
    .live .seg { opacity: .85; }
    .empty { text-align: center; color: var(--text-faint); padding: 40px 16px; }
    footer { padding: 8px 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; align-items: center; }
    footer .spacer { flex: 1; }
    #jump { position: fixed; bottom: 56px; right: 16px; }
    .cap-toggle { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-soft); cursor: pointer; }
    .seg.flash { background: var(--accent-soft); transition: background .6s; }
    #notesView { flex: 1; overflow-y: auto; padding: 8px 12px; }
  </style>
</head>
<body>
  <header>
    <div class="top">
      <span class="title" id="title">MeetScribe</span>
      <span class="timer" id="timer"></span>
      <label class="cap-toggle" data-i18n-title="sp.captionsTitle" title="在会议页面上显示字幕条，关掉侧边栏也会保留"><input id="captions" type="checkbox"><span data-i18n="sp.captions">悬浮字幕</span></label>
    </div>
    <div class="sources" id="sources"></div>
    <div class="langs hidden" id="langRow"><span class="faint" data-i18n="sp.langs">语言</span><span id="langs"></span><span class="faint" id="langNote"></span></div>
    <div class="tabs" id="tabs">
      <button class="tab sel" data-tab="list" data-i18n="notes.tabCaptions">字幕</button>
      <button class="tab" data-tab="notesView" data-i18n="notes.tabNotes">纪要</button>
    </div>
  </header>
  <div id="notices"></div>
  <main id="list"><div class="empty" id="empty" data-i18n="sp.notRecording">未在录制。点浏览器工具栏里的扩展图标开始。</div></main>
  <main id="notesView" class="hidden"></main>
  <div class="live" id="live"></div>
  <button id="jump" class="hidden" data-i18n="sp.jump">↓ 最新</button>
  <footer>
    <button id="stop" class="danger hidden" data-i18n="common.stop">停止</button>
    <span class="spacer"></span>
    <button class="link" id="history" data-i18n="common.historyShort">历史</button>
    <button class="link" id="options" data-i18n="common.options">设置</button>
  </footer>
  <script type="module" src="sidepanel.js"></script>
</body>
</html>
